<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sum(...val) {
            let total=0;
            for(let n of val)
            total+=n;
        console.log(total);
        }
        let arr=parseInt(prompt("Enter the size"));
        let values=[];
        for(let i=0;i<arr;i++) {
            values[i]=parseInt(prompt("Enter the number"));
        }
        sum(...values);
    </script>
</body>
